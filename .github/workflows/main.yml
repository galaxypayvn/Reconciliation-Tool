name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check project files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          Write-Host "Check requirements.txt:"
          if (Test-Path "$env:GITHUB_WORKSPACE\requirements.txt") {
              Write-Host "FOUND requirements.txt"
          }
          else {
              Write-Host "NOT FOUND requirements.txt"
              exit 1
          }

          Write-Host "Check run_reconciliation.py:"
          if (Test-Path "$env:GITHUB_WORKSPACE\run_reconciliation.py") {
              Write-Host "FOUND run_reconciliation.py"
          }
          else {
              Write-Host "NOT FOUND run_reconciliation.py"
              exit 1
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --name ReconciliationTool `
            "$env:GITHUB_WORKSPACE\run_reconciliation.py"

      - name: Check EXE
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\dist\ReconciliationTool.exe") {
              Write-Host "EXE BUILD SUCCESS"
              Get-Item "$env:GITHUB_WORKSPACE\dist\ReconciliationTool.exe"
          }
          else {
              Write-Host "EXE BUILD FAILED"
              exit 1
          }

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ReconciliationTool-Windows
          path: dist/ReconciliationTool.exe
