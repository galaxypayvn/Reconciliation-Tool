name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
  # Build + test trên PR để phát hiện lỗi trước khi merge
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check project files
        shell: pwsh
        run: |
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"

          Write-Host "Check requirements.txt:"
          if (Test-Path "$env:GITHUB_WORKSPACE\requirements.txt") {
              Write-Host "FOUND requirements.txt"
          }
          else {
              Write-Host "NOT FOUND requirements.txt"
              exit 1
          }

          Write-Host "Check run_reconciliation.py:"
          if (Test-Path "$env:GITHUB_WORKSPACE\run_reconciliation.py") {
              Write-Host "FOUND run_reconciliation.py"
          }
          else {
              Write-Host "NOT FOUND run_reconciliation.py"
              exit 1
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # pyinstaller đã có (ghim phiên bản) trong requirements.txt
          python -m pip install -r "$env:GITHUB_WORKSPACE\requirements.txt"

      # Chỉ chạy unit test: golden test cần file Excel thật (DAILY_RECON bị gitignore)
      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v

      - name: Build EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --noupx `
            --clean `
            --name ReconciliationTool `
            "$env:GITHUB_WORKSPACE\run_reconciliation.py"

      - name: Check EXE
        shell: pwsh
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\dist\ReconciliationTool.exe") {
              Write-Host "EXE BUILD SUCCESS"
              Get-Item "$env:GITHUB_WORKSPACE\dist\ReconciliationTool.exe"
          }
          else {
              Write-Host "EXE BUILD FAILED"
              exit 1
          }

      # Chạy thử exe trong thư mục trống: không có dữ liệu nên STEP 3 sẽ báo
      # "No rows to export" (exit 1) -> chỉ kiểm tra exe khởi động và chạy xong STEP 1
      - name: Smoke test EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path smoke | Out-Null
          Set-Location smoke

          "`n" | & "$env:GITHUB_WORKSPACE\dist\ReconciliationTool.exe" *> run.log
          Get-Content run.log

          if (-not (Select-String -Path run.log -SimpleMatch "STEP 1 - Convert Excel -> CSV/JSON completed" -Quiet)) {
              Write-Host "EXE SMOKE TEST FAILED"
              exit 1
          }

          Write-Host "EXE SMOKE TEST PASSED"
          exit 0

      - name: Upload EXE
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ReconciliationTool-Windows
          path: dist/ReconciliationTool.exe
